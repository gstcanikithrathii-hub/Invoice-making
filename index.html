<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sales Invoice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1D3557; --ink-2:#2B4A75; --text:#17212F; --muted:#5F6B7A; --line:#DCE1E8;
  --bg:#F4F6F9; --card:#FFFFFF; --mark:#F2A900; --mark-ink:#2A1E00; --danger:#B3261E; --ok:#1B7F4B; --warn:#9A6200;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FA6E0;outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:56px}
.topbar h1{margin:0;font-size:1.1rem;font-weight:650;flex:1;letter-spacing:.2px}
.topbar .back{background:none;border:0;color:#fff;width:44px;height:44px;border-radius:10px;font-size:1.5rem;cursor:pointer;display:none}
.topbar .back.on{display:block}
#app{max-width:760px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 10px;font-size:1rem;font-weight:650}
.card h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.fld>span i{color:var(--danger);font-style:normal}
input,select,textarea{width:100%;min-height:48px;border:1px solid #BFC7D2;border-radius:10px;background:#fff;padding:10px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}
input[readonly]{background:#F1F3F6;color:#39465A}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>.fld{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--ink);background:#fff;color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:#fff}
.btn.mark{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--ink-2);font-weight:600;padding:8px;cursor:pointer;min-height:40px}
.link.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hero{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.hero .btn{min-height:76px;font-size:1.25rem;border-radius:16px}
.hero p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--text);min-height:84px;justify-content:center}
.tile b{font-size:1.02rem}
.tile span{color:var(--muted);font-size:.88rem}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px;cursor:pointer;text-align:left;width:100%}
.li .l{min-width:0}
.li .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .l span{display:block;color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;flex-shrink:0}
.li .r b{display:block}
.chip{display:inline-block;font-size:.76rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-top:3px}
.chip.ok{color:var(--ok);border-color:#BFE3CE;background:#EFF9F3}
.chip.warn{color:var(--warn);border-color:#F0D9A8;background:#FFF8E8}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .btn{margin-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #BFC7D2;border-radius:10px;overflow:hidden}
.seg button{min-height:44px;border:0;background:#fff;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.check{display:flex;gap:12px;align-items:center;min-height:48px;font-weight:600}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#FBFCFD;margin-bottom:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.amt{min-height:48px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:#EEF2F7;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums}
.totals{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#fff}
.totals .t{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.totals .t.g{background:var(--ink);color:#fff;font-size:1.3rem;font-weight:750;border:0;padding:14px}
.totals .words{padding:10px 14px;font-size:.9rem;color:var(--muted);background:#F8F9FB}
.note{font-size:.88rem;border-radius:10px;padding:9px 12px;background:#EEF2F7;color:#33425A;margin:0 0 12px}
.note.warn{background:#FFF8E8;color:var(--warn)}
details.card summary{font-weight:650;cursor:pointer;min-height:32px}
details.card[open] summary{margin-bottom:12px}
.actions3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions3 .btn{padding:0 6px;font-size:.95rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:600}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--ink)}
.nav a.plus span.ic{background:var(--mark);color:var(--mark-ink);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,23,36,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:#fff;width:100%;max-width:760px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:1.1rem}
.icon-btn{border:0;background:none;font-size:1.7rem;width:44px;height:44px;cursor:pointer;color:var(--muted)}
.sheet-body{overflow:auto;padding:14px 18px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot:empty{display:none}
.sheet-foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17212F;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;max-width:92vw;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.logo-prev{width:72px;height:72px;border:1px dashed #BFC7D2;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%}
.folder{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;min-height:52px;padding:0 6px;cursor:pointer}
.crumb{font-size:.9rem;color:var(--muted);margin-bottom:8px;word-break:break-word}
/* invoice preview (document look) */
.docwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#E9EDF2;padding:10px}
.inv{background:#fff;min-width:640px;max-width:800px;margin:0 auto;padding:18px;color:#111;font-size:12px;line-height:1.4;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.inv h2{margin:0;font-size:17px}
.inv .hd{display:flex;gap:12px;align-items:flex-start;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.inv .hd img{max-width:96px;max-height:66px;object-fit:contain}
.inv .ttl{text-align:center;font-weight:800;font-size:15px;color:var(--ink);padding:8px 0 6px}
.inv table{width:100%;border-collapse:collapse}
.inv th,.inv td{border:1px solid #7F8B9B;padding:5px 6px;vertical-align:top;text-align:left}
.inv th{background:#EEF1F6}
.inv td.n,.inv th.n{text-align:right;white-space:nowrap}
.inv .grand td{background:var(--ink);color:#fff;font-weight:800;font-size:13px}
.inv .pre{white-space:pre-line}
.inv .sig{text-align:right;margin-top:10px;padding-top:6px}
@media (min-width:760px){.nav{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" aria-label="Back">‹</button>
  <h1 id="title">Sales Invoice</h1>
</header>
<main id="app"></main>
<nav class="nav" aria-label="Main">
  <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</a>
  <a href="#/saved" data-nav="saved"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></svg>Invoices</a>
  <a href="#/new" class="plus" data-nav="form"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>New</a>
  <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
</nav>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
